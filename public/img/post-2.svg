<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A startup's tech stack drawn as four layers: interface, API, data and cloud">
  <defs>
    <linearGradient id="p2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f4c4a"/>
      <stop offset="100%" stop-color="#0b1f2e"/>
    </linearGradient>
    <radialGradient id="p2glow" cx="0.3" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p2dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#fff" fill-opacity="0.08"/>
    </pattern>
    <filter id="p2sh" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#p2bg)"/>
  <rect width="960" height="540" fill="url(#p2dots)"/>
  <rect width="960" height="540" fill="url(#p2glow)"/>

  <!-- connector spine -->
  <path d="M480 150v270" stroke="#5eead4" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- layer: cloud (bottom) -->
  <g filter="url(#p2sh)">
    <path d="M480 400l250 58-250 58-250-58z" fill="#134e4a"/>
    <path d="M230 458v14l250 58v-14z" fill="#0f3d3a"/>
    <path d="M730 458v14l-250 58v-14z" fill="#0b302e"/>
  </g>
  <path d="M430 452c0-12 10-20 22-20 4-12 16-20 30-20 18 0 32 14 32 30 12 0 20 8 20 18H430z" fill="#5eead4" fill-opacity="0.9" transform="translate(-6 0)"/>

  <!-- layer: data -->
  <g filter="url(#p2sh)">
    <path d="M480 318l250 58-250 58-250-58z" fill="#115e59"/>
    <path d="M230 376v14l250 58v-14z" fill="#0f4744"/>
    <path d="M730 376v14l-250 58v-14z" fill="#0c3a38"/>
  </g>
  <ellipse cx="480" cy="360" rx="34" ry="11" fill="#99f6e4"/>
  <path d="M446 360v26c0 6 15 11 34 11s34-5 34-11v-26" fill="#5eead4"/>
  <ellipse cx="480" cy="373" rx="34" ry="11" fill="none" stroke="#115e59" stroke-width="2"/>

  <!-- layer: API -->
  <g filter="url(#p2sh)">
    <path d="M480 236l250 58-250 58-250-58z" fill="#0f766e"/>
    <path d="M230 294v14l250 58v-14z" fill="#0d5c56"/>
    <path d="M730 294v14l-250 58v-14z" fill="#0a4b46"/>
  </g>
  <path d="M452 282l-16 12 16 12M508 282l16 12-16 12M488 276l-16 36" fill="none" stroke="#ccfbf1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- layer: interface (top) -->
  <g filter="url(#p2sh)">
    <path d="M480 154l250 58-250 58-250-58z" fill="#14b8a6"/>
    <path d="M230 212v14l250 58v-14z" fill="#0f9488"/>
    <path d="M730 212v14l-250 58v-14z" fill="#0c7d73"/>
  </g>
  <path d="M430 204l50-12 50 12-50 12z" fill="#f0fdfa"/>
  <path d="M446 204l34-8 34 8-34 8z" fill="#14b8a6" fill-opacity="0.35"/>

  <!-- labels -->
  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#ccfbf1">
    <text x="760" y="218">Interface</text>
    <text x="760" y="300">API</text>
    <text x="760" y="382">Data</text>
    <text x="760" y="464">Cloud</text>
  </g>
  <g stroke="#5eead4" stroke-opacity="0.55" stroke-width="1.5">
    <path d="M736 212h16M736 294h16M736 376h16M736 458h16"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="An AI assistant answering a shopping question by citing a store's product">
  <defs>
    <linearGradient id="p1bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b3a5c"/>
      <stop offset="100%" stop-color="#0a1a33"/>
    </linearGradient>
    <radialGradient id="p1glow" cx="0.72" cy="0.3" r="0.55">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p1grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#fff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="p1sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#p1bg)"/>
  <rect width="960" height="540" fill="url(#p1grid)"/>
  <rect width="960" height="540" fill="url(#p1glow)"/>

  <!-- chat window -->
  <g filter="url(#p1sh)">
    <rect x="250" y="70" width="560" height="410" rx="22" fill="#ffffff"/>
  </g>
  <rect x="250" y="70" width="560" height="54" rx="22" fill="#f1f5f9"/>
  <rect x="250" y="100" width="560" height="24" fill="#f1f5f9"/>
  <circle cx="282" cy="97" r="6" fill="#cbd5e1"/>
  <circle cx="302" cy="97" r="6" fill="#cbd5e1"/>
  <circle cx="322" cy="97" r="6" fill="#cbd5e1"/>

  <!-- user question -->
  <rect x="440" y="146" width="344" height="58" rx="18" fill="#0284c5"/>
  <rect x="462" y="164" width="248" height="9" rx="4.5" fill="#fff" fill-opacity="0.95"/>
  <rect x="462" y="182" width="176" height="9" rx="4.5" fill="#fff" fill-opacity="0.7"/>

  <!-- assistant answer -->
  <circle cx="294" cy="246" r="18" fill="#e0f2fe"/>
  <path d="M294 234l3.2 8.8 8.8 3.2-8.8 3.2-3.2 8.8-3.2-8.8-8.8-3.2 8.8-3.2z" fill="#0284c5"/>
  <rect x="326" y="230" width="300" height="9" rx="4.5" fill="#334155"/>
  <rect x="326" y="248" width="250" height="9" rx="4.5" fill="#94a3b8"/>

  <!-- cited product card -->
  <rect x="326" y="278" width="400" height="140" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="344" y="296" width="104" height="104" rx="12" fill="#e7d9c5"/>
  <path d="M366 330h60a8 8 0 0 1 8 8v36a8 8 0 0 1-8 8h-60a8 8 0 0 1-8-8v-36a8 8 0 0 1 8-8z" fill="#8b5e3c"/>
  <path d="M358 346h76" stroke="#6b4428" stroke-width="3"/>
  <circle cx="420" cy="360" r="5" fill="#e7d9c5"/>
  <rect x="468" y="302" width="180" height="11" rx="5.5" fill="#0f172a"/>
  <rect x="468" y="324" width="120" height="9" rx="4.5" fill="#94a3b8"/>
  <rect x="468" y="350" width="64" height="22" rx="11" fill="#dcfce7"/>
  <rect x="480" y="358" width="40" height="7" rx="3.5" fill="#16a34a"/>
  <rect x="542" y="350" width="84" height="22" rx="11" fill="#e0f2fe"/>
  <rect x="554" y="358" width="60" height="7" rx="3.5" fill="#0284c5"/>
  <path d="M468 392h10l4-6 6 12 4-6h12" fill="none" stroke="#0284c5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="512" y="388" width="130" height="8" rx="4" fill="#0284c5" fill-opacity="0.55"/>

  <!-- follow-up line -->
  <rect x="326" y="438" width="220" height="9" rx="4.5" fill="#cbd5e1"/>
</svg>

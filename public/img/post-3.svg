<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="A SaaS analytics dashboard with an AI assistant panel suggesting the next action">
  <defs>
    <linearGradient id="p3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0b1f24"/>
    </linearGradient>
    <radialGradient id="p3glow" cx="0.78" cy="0.62" r="0.5">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p3area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="p3grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#fff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="p3sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#p3bg)"/>
  <rect width="960" height="540" fill="url(#p3grid)"/>
  <rect width="960" height="540" fill="url(#p3glow)"/>

  <!-- dashboard -->
  <g filter="url(#p3sh)">
    <rect x="110" y="84" width="560" height="380" rx="20" fill="#ffffff"/>
  </g>
  <rect x="110" y="84" width="130" height="380" rx="20" fill="#f1f5f9"/>
  <rect x="220" y="84" width="20" height="380" fill="#f1f5f9"/>
  <rect x="134" y="112" width="70" height="12" rx="6" fill="#16a34a"/>
  <rect x="134" y="152" width="82" height="9" rx="4.5" fill="#94a3b8"/>
  <rect x="134" y="176" width="64" height="9" rx="4.5" fill="#cbd5e1"/>
  <rect x="134" y="200" width="76" height="9" rx="4.5" fill="#cbd5e1"/>
  <rect x="134" y="224" width="58" height="9" rx="4.5" fill="#cbd5e1"/>

  <!-- stat tiles -->
  <rect x="266" y="108" width="120" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="282" y="124" width="54" height="8" rx="4" fill="#94a3b8"/>
  <rect x="282" y="144" width="78" height="16" rx="5" fill="#0f172a"/>
  <rect x="402" y="108" width="120" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="418" y="124" width="62" height="8" rx="4" fill="#94a3b8"/>
  <rect x="418" y="144" width="60" height="16" rx="5" fill="#0f172a"/>
  <rect x="538" y="108" width="110" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="554" y="124" width="46" height="8" rx="4" fill="#94a3b8"/>
  <rect x="554" y="144" width="70" height="16" rx="5" fill="#0f172a"/>

  <!-- chart -->
  <rect x="266" y="196" width="382" height="244" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <g stroke="#e2e8f0" stroke-width="1.5">
    <path d="M290 260h334M290 310h334M290 360h334M290 410h334"/>
  </g>
  <path d="M290 392l48-20 48 12 48-44 48 16 48-52 48-10 48-34v140H290z" fill="url(#p3area)"/>
  <path d="M290 392l48-20 48 12 48-44 48 16 48-52 48-10 48-34" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="626" cy="260" r="7" fill="#16a34a" stroke="#fff" stroke-width="3"/>

  <!-- AI panel -->
  <g filter="url(#p3sh)">
    <rect x="600" y="230" width="270" height="222" rx="18" fill="#0f172a"/>
  </g>
  <circle cx="634" cy="264" r="16" fill="#22c55e" fill-opacity="0.18"/>
  <path d="M634 252l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#4ade80"/>
  <rect x="660" y="258" width="110" height="11" rx="5.5" fill="#e2e8f0"/>
  <rect x="624" y="300" width="222" height="9" rx="4.5" fill="#94a3b8"/>
  <rect x="624" y="318" width="196" height="9" rx="4.5" fill="#94a3b8"/>
  <rect x="624" y="336" width="150" height="9" rx="4.5" fill="#94a3b8"/>
  <rect x="624" y="370" width="222" height="56" rx="12" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.5"/>
  <rect x="640" y="386" width="120" height="9" rx="4.5" fill="#86efac"/>
  <rect x="640" y="404" width="84" height="8" rx="4" fill="#4ade80" fill-opacity="0.6"/>
  <rect x="780" y="384" width="50" height="28" rx="14" fill="#22c55e"/>
</svg>
